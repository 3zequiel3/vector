# Vector — repository contract.
#
# [stack] and [commands] are detected: `vector init` regenerates them.
# [scope] and [mode] are yours: preserved verbatim across runs.

[stack]
languages = [
  "go",
]

[stack.package_manager]
name = "go"
source = "lockfile"
lockfile = "go.sum"
# declared = ""  (no local evidence)
installed = "1.27.1"

[stack.runtime]
declared = "1.27.1"
installed = "1.27.1"

# Verification commands, read from the project's own manifests.
# Vector invokes them; it never invents them.
#
# Shown commented out, as detected. Detection stays live — vector re-reads
# the manifests on every run, so an upgraded project needs no edit here.
# Uncomment a line only to correct what detection got wrong: an uncommented
# value wins, survives `vector init`, and goes on winning until you
# remove it.
[commands]
# test = "go test ./..."  (detected)
# typecheck = ""  (no local evidence)
# build = "go build ./..."  (detected)
# lint = "go vet ./..."  (detected)

[scope]
# Always denied, even under a wide scope: an agent with write access
# to the configuration that constrains it can weaken that constraint.
always_forbidden = [
  ".vector/**",
  ".claude/settings.json",
  ".claude/settings.local.json",
  ".claude/hooks/**",
  ".codex/hooks.json",
  ".cursor/hooks.json",
  ".env",
  ".env.*",
  ".claude/agents/**",
  ".claude/skills/**",
  ".claude/commands/**",
  ".mcp.json",
  ".codex/config.toml",
  ".cursor/mcp.json",
  ".git/hooks/**",
  ".git/config",
  ".gitignore",
  "**/.gitignore",
  ".git/info/exclude",
  ".gitattributes",
]

# Written deliberately or not at all. Never denied — a migration and a
# workflow are things a change legitimately edits. They are named in every
# report, and a boundary of "**" does not count as having declared them.
high_risk = [
  "**/migrations/**",
  ".github/workflows/**",
  ".gitlab-ci.yml",
  "Jenkinsfile",
  "**/*.tf",
  "**/*.tfvars",
  "Dockerfile",
  "**/docker-compose*.yml",
  "**/*.pem",
  "**/*.p12",
  "**/*.pfx",
]

expansion_requires_evidence = true

[mode]
# advisory: report and continue. strict: a violation is a hard failure.
enforcement = "advisory"
# sandbox: let the OS deny the writes vector cannot see. A script that
# opens a file is invisible to a tool-level hook; the sandbox is not.
# Off by default: it changes how every Bash command in the session runs.
sandbox = false
